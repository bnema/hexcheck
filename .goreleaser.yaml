version: 2

# Releases are published on the ermite forge through its GitHub-compatible API.
github_urls:
  api: https://git.bnema.dev/-/github/api/
  upload: https://git.bnema.dev/-/github/api/uploads/
  download: https://git.bnema.dev/

release:
  github:
    owner: bnema
    name: hexcheck
  draft: true
  prerelease: auto

builds:
  - id: hexcheck
    main: ./cmd/hexcheck
    binary: hexcheck
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs"
      - "^test"
      - "^chore"
