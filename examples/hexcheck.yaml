version: 1
components:
  core:
    role: core
    paths:
      - internal/domain/**
      - internal/core/**
  usecase:
    role: usecase
    paths:
      - internal/application/usecase/**
  ports:
    role: ports
    paths:
      - internal/application/port/**
  adapters:
    role: adapter
    paths:
      - internal/infrastructure/**
      - internal/adapters/**
      - internal/ui/**
      - internal/cli/**
  entrypoints:
    role: entrypoint
    paths:
      - cmd/**
  generated:
    role: ignore
    paths:
      - '**/mocks/**'
      - '**/generated/**'

rules:
  no-adapter-imports-in-core: error
  no-infra-imports-in-usecase: error
  no-framework-types-in-core: error
  no-infra-types-in-ports: error
  no-adapter-to-adapter-imports: warn
  suspicious-business-logic-in-adapter: warn
  no-local-fakes-for-ports: warn
  prefer-generated-mocks: warn

externalTypes:
  frameworkPackages: []
  adapterTypePackages:
    - internal/infrastructure/**
    - internal/adapters/**

heuristics:
  businessLogicThreshold: 4
  businessKeywords:
    - Validate
    - Authorize
    - Compute
    - Calculate
    - Apply
    - Transition
    - Can

mocking:
  generatedMockPaths:
    - internal/mocks/**
    - internal/application/mocks/**
  generatedMockNamePatterns:
    - Mock{{Interface}}
    - '{{Interface}}Mock'
