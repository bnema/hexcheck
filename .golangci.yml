version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unconvert
    - unused
  settings:
    errcheck:
      # CLI writes to stdout/stderr; a failed write has no useful recovery.
      exclude-functions:
        - fmt.Fprintf
        - fmt.Fprintln
  exclusions:
    paths:
      - analyzer/testdata
    rules:
      - path: _test\.go
        linters:
          - errcheck
